<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Alerta Natural</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="logo-login">
        <span>🌎</span>
        <h1>Alerta Natural</h1>
        <p>Acesse sua conta para continuar</p>
      </div>

      <form id="login-form">

        <div class="input-group-custom">
          <i class='bx bx-user'></i>
          <input type="text" id="username" placeholder="Usuário ou email" required>
        </div>

        <div class="input-group-custom">
          <i class='bx bx-lock-alt'></i>
          <input type="password" id="password" placeholder="Senha" required>
        </div>

        <button type="submit" class="btn-login">
          Entrar
        </button>

      </form>

      <p class="register-text">
        Ainda não tem conta?
        <button type="button" data-bs-toggle="modal" data-bs-target="#modalCadastro">
          Criar conta
        </button>
      </p>

      <a href="../index.html" class="voltar-link">
        ← Voltar ao monitoramento
      </a>

    </section>

  </main>

  <div class="modal fade" id="modalCadastro" tabindex="-1" aria-labelledby="modalCadastroLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title" id="modalCadastroLabel">
            Criar conta
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>

        </div>

        <div class="modal-body">

          <form id="cadastro-form">

            <div class="input-group-custom">
              <i class='bx bx-user'></i>
              <input type="text" id="nomeCompleto" placeholder="Nome completo" required>
            </div>

            <div class="input-group-custom">
              <i class='bx bx-user-circle'></i>
              <input type="text" id="novoUsuario" placeholder="Nome de usuário" required>
            </div>

            <div class="input-group-custom">
              <i class='bx bx-envelope'></i>
              <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="input-group-custom">
              <i class='bx bx-map'></i>
              <input type="text" id="localizacao" placeholder="Localização">
            </div>

            <div class="input-group-custom">
              <i class='bx bx-lock-alt'></i>
              <input type="password" id="senha" placeholder="Senha" required>
            </div>

            <div class="input-group-custom">
              <i class='bx bx-lock-alt'></i>
              <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required>
            </div>

          </form>

        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>

          <button type="submit" form="cadastro-form" class="btn btn-primary">
            Salvar
          </button>

        </div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/config.js"></script>
<script src="../js/login.js"></script>
</body>

</html>
