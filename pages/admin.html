<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Administrativo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

  <div class="container-fluid">

    <header class="py-3 border-bottom">
      <div class="d-flex justify-content-between align-items-center">
        <h2>🔒 Painel Administrativo</h2>

        <a href="../index.html" class="btn btn-secondary">
          Voltar ao Sistema
        </a>
      </div>
    </header>

    <ul class="nav nav-tabs mt-4">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#alertas">
          Alertas
        </button>
      </li>

      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#noticias">
          Notícias
        </button>
      </li>
    </ul>

    <div class="tab-content mt-4">

      <div class="tab-pane fade show active" id="alertas">
        <div class="row">

          <div class="col-lg-4">
            <div class="card">
              <div class="card-header">
                <h4>Cadastrar Alerta</h4>
              </div>

              <div class="card-body">
                <form id="formAlerta">

                  <div class="mb-3">
                    <label>Data</label>
                    <input type="date" id="data" class="form-control">
                  </div>

                  <div class="mb-3">
                    <label>Cidade</label>
                    <input type="text" id="cidade" class="form-control">
                  </div>

                  <div class="mb-3">
                    <label>Tipo</label>
                    <select id="tipo" class="form-select">
                      <option>Chuva Forte</option>
                      <option>Enchente</option>
                      <option>Deslizamento</option>
                      <option>Tempestade</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label>Nível de risco</label>
                    <select id="nivel" class="form-select">
                      <option>Baixo</option>
                      <option>Médio</option>
                      <option>Alto</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label>Descrição</label>
                    <textarea id="descricao" rows="5" class="form-control"></textarea>
                  </div>

                  <button class="btn btn-primary w-100">
                    Salvar Alerta
                  </button>

                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card h-100">
              <div class="card-header">
                <h4>Alertas Cadastrados</h4>
              </div>

              <div class="card-body">
                <div id="listaAlertas"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="tab-pane fade" id="noticias">
        <div class="card">
          <div class="card-header">
            <h4>Cadastrar Notícia Climática</h4>
          </div>

          <div class="card-body">
            <form id="formNoticia">

              <div class="mb-3">
                <label>Título</label>
                <input type="text" id="titulo" class="form-control">
              </div>

              <div class="mb-3">
                <label>Subtítulo</label>
                <input type="text" id="subtitulo" class="form-control">
              </div>

              <div class="mb-3">
                <label>Descrição</label>
                <textarea id="descricaoNoticia" rows="6" class="form-control"></textarea>
              </div>

              <div class="row">
                <div class="col">
                  <select id="tipoDesastre" class="form-select">
                    <option>Alagamento</option>
                    <option>Deslizamento</option>
                  </select>
                </div>

                <div class="col">
                  <select id="regiao" class="form-select">
                    <option>Norte</option>
                    <option>Nordeste</option>
                    <option>Centro-Oeste</option>
                    <option>Sudeste</option>
                    <option>Sul</option>
                  </select>
                </div>

                <div class="col">
                  <select id="severidade" class="form-select">
                    <option>Baixa</option>
                    <option>Média</option>
                    <option>Alta</option>
                    <option>Crítica</option>
                  </select>
                </div>
              </div>

              <div class="mt-4">
                <button class="btn btn-success">
                  Publicar Notícia
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin.js"></script>

</body>

</html>
