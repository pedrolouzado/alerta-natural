<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PREFERÊNCIAS DO USUÁRIO</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

</head>

<body class="bg-light">

  <div class="container mt-5">

    <div class="card p-4 shadow-sm">

      <h1 class="text-center mb-4">
        CONFIGURAÇÕES DE EXIBIÇÃO
      </h1>

      <div class="form-check form-switch">

        <input
          class="form-check-input preferencia"
          type="checkbox"
          id="modoEscuro"
        >

        <label class="form-check-label" for="modoEscuro">
          Modo Escuro / Noturno
        </label>

        <small class="d-block text-muted">
          Ativa o tema escuro da aplicação.
        </small>

      </div>

      <div class="form-check form-switch mt-3">

        <input
          class="form-check-input preferencia"
          type="checkbox"
          id="modoSatelite"
        >

        <label class="form-check-label" for="modoSatelite">
          Modo Satélite
        </label>

        <small class="d-block text-muted">
          Exibe o mapa em visualização de satélite.
        </small>

      </div>

      <div class="form-check form-switch mt-3 mb-4">

        <input
          class="form-check-input preferencia"
          type="checkbox"
          id="daltonismo"
        >

        <label class="form-check-label" for="daltonismo">
          Adaptado para Daltonismo
        </label>

        <small class="d-block text-muted">
          Melhora a acessibilidade alterando as cores da interface.
        </small>

      </div>

      <p
        id="mensagem"
        class="alert alert-primary d-none"
      ></p>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
