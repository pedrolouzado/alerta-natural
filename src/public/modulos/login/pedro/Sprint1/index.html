<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alerta BR</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container-fluid">

    <div class="row vh-100">

      <!-- FORMULÁRIO -->
      <div class="col-md-3 bg-light p-4">

        <h2 class="mb-4">Cadastrar Alerta</h2>

        <form id="formAlerta">

          <div class="mb-3">
            <label class="form-label">Cidade</label>

            <input
              type="text"
              class="form-control"
              id="cidade"
              required
            >
          </div>

          <div class="mb-3">

            <label class="form-label">
              Tipo de Alerta
            </label>

            <select class="form-select" id="tipo">

              <option>Chuva Forte</option>
              <option>Enchente</option>
              <option>Deslizamento</option>
              <option>Tempestade</option>

            </select>

          </div>

          <div class="mb-3">

            <label class="form-label">
              Nível de Risco
            </label>

            <select class="form-select" id="nivel">

              <option>Baixo</option>
              <option>Médio</option>
              <option>Alto</option>

            </select>

          </div>

          <div class="mb-3">

            <label class="form-label">
              Descrição
            </label>

            <textarea
              class="form-control"
              id="descricao"
              rows="4"
            ></textarea>

          </div>

          <button class="btn btn-primary w-100">
            Adicionar Alerta
          </button>

        </form>

      </div>

      <!-- MAPA -->
      <div class="col-md-6 p-0">

        <div id="map"></div>

      </div>

      <!-- PAINEL -->
      <div class="col-md-3 bg-white p-4">

        <h2 class="mb-4">Alertas Ativos</h2>

        <div id="listaAlertas"></div>

      </div>

    </div>

  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- JavaScript -->
  <script src="js/app.js"></script>

</body>
</html>
