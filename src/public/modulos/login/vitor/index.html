<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PREFERÊNCIAS</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

</head>

<body class="bg-light">

  <div class="container mt-5">

    <div class="card p-4 shadow-sm">

      <h1 class="text-center mb-4">
        PREFERÊNCIAS
      </h1>

      <h2 class="h5 mb-3">
        Tipos de alerta
      </h2>

      <div class="form-check">

        <input
          class="form-check-input alerta"
          type="checkbox"
          value="Chuva forte"
          id="chuva"
        >

        <label class="form-check-label" for="chuva">
          Chuva forte
        </label>

      </div>

      <div class="form-check">

        <input
          class="form-check-input alerta"
          type="checkbox"
          value="Enchente"
          id="enchente"
        >

        <label class="form-check-label" for="enchente">
          Enchente
        </label>

      </div>

      <div class="form-check mb-4">

        <input
          class="form-check-input alerta"
          type="checkbox"
          value="Deslizamento"
          id="deslizamento"
        >

        <label class="form-check-label" for="deslizamento">
          Deslizamento
        </label>

      </div>

      <hr>

      <h2 class="h5 mt-3 mb-3">
        Níveis de risco
      </h2>

      <div class="form-check">

        <input
          class="form-check-input alerta"
          type="checkbox"
          value="Baixo"
          id="baixo"
        >

        <label class="form-check-label" for="baixo">
          🟢 Baixo
        </label>

      </div>

      <div class="form-check">

        <input
          class="form-check-input alerta"
          type="checkbox"
          value="Médio"
          id="medio"
        >

        <label class="form-check-label" for="medio">
          🟡 Médio
        </label>

      </div>

      <div class="form-check mb-4">

        <input
          class="form-check-input alerta"
          type="checkbox"
          value="Alto"
          id="alto"
        >

        <label class="form-check-label" for="alto">
          🔴 Alto
        </label>

      </div>

      <p
        id="mensagem"
        class="alert alert-primary d-none"
      ></p>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
